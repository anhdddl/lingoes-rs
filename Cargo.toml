[workspace]
members = [
    "apps/lingoes-desktop",
    "crates/lingoes-core",
    "crates/lingoes-dictionary",
    "crates/lingoes-translator",
    "crates/lingoes-tts",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
lingoes-core = { path = "crates/lingoes-core" }
lingoes-dictionary = { path = "crates/lingoes-dictionary" }
lingoes-translator = { path = "crates/lingoes-translator" }
lingoes-tts = { path = "crates/lingoes-tts" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
unicode-normalization = "0.1"
