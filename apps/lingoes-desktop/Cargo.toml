[package]
name = "lingoes-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
arboard = { workspace = true }
lingoes-capture = { workspace = true }
lingoes-core = { workspace = true }
lingoes-dictionary = { workspace = true }
lingoes-platform = { workspace = true }
lingoes-translator = { workspace = true }
lingoes-tts = { workspace = true }
slint = { version = "=1.8.0", default-features = false, features = [
    "backend-winit",
    "compat-1-2",
    "renderer-femtovg",
    "raw-window-handle-06",
] }
tokio = { workspace = true }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

[build-dependencies]
slint-build = "=1.8.0"

[dev-dependencies]
tempfile = "3.15"
